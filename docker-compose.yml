# Local MongoDB as a single-node replica set. Multi-document transactions
# (used when a column is rebalanced) only work on a replica set.
services:
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # rs.status() throws until the replica set exists, so the first successful
    # check initiates it; every later check just reports the status.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
